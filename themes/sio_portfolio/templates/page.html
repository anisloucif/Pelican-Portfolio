{% extends "base.html" %}
{% block title %}{{ page.title }}{% endblock %}
{% block content %}
<article class="page-sheet">
    <header class="page-head">
        {% if page.kicker %}<p class="kicker">{{ page.kicker }}</p>{% endif %}
        <h1>{{ page.title }}</h1>
        {% if page.lead %}<p class="lead-text">{{ page.lead }}</p>{% endif %}
    </header>
    <div class="page-body">
        {{ page.content }}
    </div>
</article>
{% endblock %}
